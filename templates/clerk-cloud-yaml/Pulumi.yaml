name: ${PROJECT}
description: ${DESCRIPTION}
runtime: yaml
template:
  description: Scaffold a Clerk JWT template with Pulumi
  config:
    clerk:apiKey:
      description: Clerk instance API key (secret key sk_...) or set CLERK_API_KEY.
      secret: true
    templateName:
      description: Name for the JWT template
      default: access_token
    claimsJson:
      description: "JSON string of JWT claims"
      default: "{}"
config:
  templateName:
    type: string
    default: access_token
  claimsJson:
    type: string
    default: "{}"
resources:
  # The default provider reads the key from `clerk:apiKey` or CLERK_API_KEY.
  jwt-template:
    type: clerk:JwtTemplate
    properties:
      name: ${templateName}
      claims: ${claimsJson}
outputs:
  templateId: ${jwt-template.id}
