[project]
  name = "pulumi_labs_clerk"
  description = "Experimental: manage Clerk (clerk.com) authentication infrastructure as code: allowlists, blocklists, JWT templates, organizations and their roles and permissions, OAuth applications, SAML connections, API keys, machines and webhooks."
  dependencies = ["parver>=0.2.1", "pulumi>=3.231.0,<4.0.0", "semver>=2.8.1", "typing-extensions>=4.11,<5; python_version < \"3.11\""]
  keywords = ["pulumi", "clerk", "auth", "authentication", "identity", "sso", "organizations", "category/infrastructure"]
  readme = "pulumi_labs_clerk/README.md"
  requires-python = ">=3.9"
  version = "0.0.1+dev"
  license = "Apache-2.0"
  [project.urls]
    Homepage = "https://clerk.com"
    Repository = "https://github.com/pulumi-labs/pulumi-clerk"

[build-system]
  requires = ["setuptools>=61.0"]
  build-backend = "setuptools.build_meta"

[tool]
  [tool.setuptools]
    [tool.setuptools.package-data]
      pulumi_labs_clerk = ["py.typed", "pulumi-plugin.json"]
