credentials:
  - one_of:
      - [CLERK_API_KEY]
      - [CLERK_SECRET_KEY]
  - name: CLERK_PLATFORM_API_KEY
    required: false
  - name: CLERK_API_URL
    required: false
account: >-
  A Clerk development instance (free plan) with an instance secret key (sk_test_...), organizations enabled
  (Organizations is a per-instance feature; ApplicationSettings.enableOrganizations can turn it on) and a
  dedicated test instance that holds no production data. CLERK_API_KEY and CLERK_SECRET_KEY are
  alternatives (CLERK_API_KEY wins); one of them is required. CLERK_API_URL only overrides the base URL for
  proxies and is not needed against the real API. CLERK_PLATFORM_API_KEY is for the Platform API (beta),
  which needs access granted by Clerk; the test account is assumed not to have it, so Application, Domain
  and InstanceConfig are not exercised. Unverified: whether a free development instance accepts custom roles,
  role sets, API keys, machines, and OrganizationDomain enrollment modes (some of these may need a paid
  feature toggle in the dashboard); QA should record any plan error as a skip, not a failure.
resources:
  - type: clerk:index:AllowlistIdentifier
    test: true
    update: null
    cost: none
  - type: clerk:index:ApiKey
    test: true
    update: description
    cost: none
  - type: clerk:index:Application
    test: false
    reason: needs the Platform API (beta) key, which Clerk grants on request; it provisions whole Clerk applications and cannot run unattended on a standard test account
  - type: clerk:index:ApplicationSettings
    test: true
    update: maxAllowedMemberships
    cost: none
  - type: clerk:index:BlocklistIdentifier
    test: true
    update: null
    cost: none
  - type: clerk:index:Domain
    test: false
    reason: needs the Platform API (beta) key plus a DNS domain the tester controls; cannot run unattended
  - type: clerk:index:InstanceConfig
    test: false
    reason: needs the Platform API (beta) key and an application and instance ID created through it; Delete is a no-op so a run would leave instance-wide config changed
  - type: clerk:index:InstanceDomain
    test: false
    reason: adds a primary or satellite domain to the instance; needs a production instance and DNS records the tester controls, and a development instance cannot take custom domains
  - type: clerk:index:JwtTemplate
    test: true
    update: lifetime
    cost: none
  - type: clerk:index:Machine
    test: true
    update: defaultTokenTtl
    cost: none
  - type: clerk:index:OauthApplication
    test: true
    update: name
    cost: none
  - type: clerk:index:Organization
    test: true
    update: name
    cost: none
  - type: clerk:index:OrganizationDomain
    test: true
    update: enrollmentMode
    cost: none
  - type: clerk:index:OrganizationMembership
    test: false
    reason: binds an existing end user to an organization; the provider cannot create users (out of scope) and QA must not create or hold real personal data, so it cannot run unattended without a pre-seeded user ID
  - type: clerk:index:OrganizationPermission
    test: true
    update: description
    cost: none
  - type: clerk:index:OrganizationRole
    test: true
    update: description
    cost: none
  - type: clerk:index:RedirectUrl
    test: true
    update: null
    cost: none
  - type: clerk:index:RoleSet
    test: true
    update: description
    cost: none
  - type: clerk:index:SamlConnection
    test: false
    reason: SAML SSO needs a paid enterprise-connection add-on and a real identity provider (IdP metadata and certificate), which the test account does not have
  - type: clerk:index:SvixWebhook
    test: true
    update: null
    cost: none
functions:
  - name: getAllowlistIdentifier
    test: true
  - name: getApiKey
    test: true
  - name: getApplication
    test: false
    reason: needs the Platform API (beta) key and an existing application
  - name: getApplicationSettings
    test: true
  - name: getBlocklistIdentifier
    test: true
  - name: getDomain
    test: false
    reason: needs the Platform API (beta) key and an existing domain
  - name: getInstanceConfig
    test: false
    reason: needs the Platform API (beta) key and an application and instance ID
  - name: getInstanceDomain
    test: false
    reason: needs a production instance with a custom domain, which the test account does not have
  - name: getJwtTemplate
    test: true
  - name: getMachine
    test: true
  - name: getOauthApplication
    test: true
  - name: getOrganization
    test: true
  - name: getOrganizationDomain
    test: true
  - name: getOrganizationMembership
    test: false
    reason: needs an existing end user and membership, which QA cannot create
  - name: getOrganizationPermission
    test: true
  - name: getOrganizationRole
    test: true
  - name: getRedirectUrl
    test: true
  - name: getRoleSet
    test: true
  - name: getSamlConnection
    test: false
    reason: needs an existing SAML connection, which needs an enterprise plan
  - name: getSvixWebhook
    test: true
regressions:
  - "#1891 an Organization created with privateMetadata {\"qa\":\"arqa\"} (and again with publicMetadata) can be renamed with pulumi up without an HTTP 422 form_param_deprecated; changing a metadata value updates it, and removing a key from the metadata object removes it from the organization (read it back with getOrganization or the Clerk dashboard)"
  - "#1890 an OauthApplication created without consentScreenEnabled reports effectiveConsentScreenEnabled true; pulumi import of it adopts no consentScreenEnabled, and a program that declares consentScreenEnabled true plans no change after the import; import of one created with consentScreenEnabled false adopts false"
  - "#1801 pulumi import of a Machine with defaultTokenTtl 7200, a JwtTemplate with lifetime 120 and ApplicationSettings with domainsEnabled true and maxAllowedMemberships 7, then pulumi preview with a program declaring those values, plans no change; the same import of objects holding Clerk's defaults (3600, 60, 5, false) with a program that omits them also plans no change (#1563). Verify the constants against a real instance: Machine defaultTokenTtl 3600, JwtTemplate lifetime 60, allowedClockSkew 5, signingAlgorithm RS256, customSigningKey false, OauthApplication consentScreenEnabled true (Clerk Backend API default, #1890), ApplicationSettings maxAllowedMemberships 5, adminDeleteEnabled true, domainsEnabled false; a wrong constant silently reintroduces #1801 or #1563 for that field"
  - "#1715 pulumi import of an ID that does not exist (for example clerk:index:Organization o org_nope, JwtTemplate, Machine, RedirectUrl) fails with 'does not exist' and leaves nothing in state; a refresh of a resource deleted outside Pulumi still drops it from state"
  - "#1683 destroying ApplicationSettings leaves the instance as it was: getApplicationSettings after pulumi destroy reports the same enableOrganizations and limits as before the stack was applied (organizations are not disabled)"
  - "#1565 OrganizationDomain created with only organizationId and name succeeds (enrollmentMode defaults to manual_invitation; the API requires it and answers 422 without it)"
  - "#1566 getOrganizationDomain accepts the OrganizationDomain resource id (organizationId/domainId) as organizationDomainId, and the bare domain id"
  - "#1562 AllowlistIdentifier: after import (notify is not reported by Clerk) a program that sets notify true or false plans no change, never a replacement"
  - "#1563 import adopts only required inputs: after import of JwtTemplate, Machine, OauthApplication and ApplicationSettings, preview of the program that leaves the optional inputs unset plans no change, and reordered or partial OauthApplication scopes are not a change"
  - "#1564 an imported Machine.secretKey (and ApiKey.secret and every other schema-secret output) is stored as a secret, not plaintext: pulumi stack export shows a secret object after import"
  - "#1183 templates use the default provider and declare clerk:apiKey in template config, so a template program runs without an explicit provider"
  - "#1183 OauthApplication takes callbackUrl (a single URL) in the team-auth example"
  - "#1413 the native provider keeps the clerk:index:<Resource> tokens and the clerk:apiKey and clerk:platformApiKey config keys, and CLERK_API_KEY falls back to CLERK_SECRET_KEY"
  - "#1413 OrganizationDomain IDs are <organizationId>/<id> and import by that composite ID works"
  - "#1413 ApiKey.name and ApiKey.createdBy force replacement while description updates in place"
  - "#1413 an unset optional input is not overwritten by a Clerk default; the default shows in the effective* or current* output and a second pulumi up shows no diff"
  - "#1413 Machine, ApiKey and OauthApplication secrets stay in state after create and are recovered on import, and Application.instances is secret"
notes: >-
  Run order and cleanup: create Organization before OrganizationDomain, OrganizationRole before RoleSet;
  destroy in reverse. OrganizationRole permissions and RoleSet roles must exist first (create
  OrganizationPermission, then OrganizationRole, then RoleSet) and RoleSet cannot be deleted while organizations use it.
  Shared state: ApplicationSettings and SvixWebhook are singletons per instance (fixed IDs application_settings and
  svix_webhook); svixUrl is a secret (it embeds a Svix login key): check that `pulumi stack output --json` shows [secret] for the
  resource output and for getSvixWebhook. Run them on a throwaway instance, and note that destroying SvixWebhook removes the Svix app and its
  endpoints. ApplicationSettings has no GET in the API, so Read sends an empty PATCH; restore the original values
  after the test. AllowlistIdentifier, BlocklistIdentifier, RedirectUrl have no API update, so every input change replaces;
  Allowlist, Blocklist, InstanceDomain and OrganizationDomain Read by listing. Allowlist entries only matter on a
  restricted-signup instance; use a throwaway identifier such as qa-test@example.invalid. OauthApplication client secret
  is only returned at create. Lookup functions never return write-only secrets. Clerk rate-limits the Backend API (about
  100 requests per 10 seconds per instance), so do not run many resources in parallel. Deferred surface (no resource):
  email and SMS templates, billing, enterprise connections, SCIM, invitations, users.
